name: Profile Automation

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC ~ 00:00 (BRT) todos os dias
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: profile-automation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake grid (dark + light)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: jeffer-matos
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300E5FF&color_dots=%230c2036,%230a2472,%230057b8,%2300aaff,%2300e5ff

      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Token com escopo `repo` + `read:user` salvo em Settings > Secrets > Actions.
          # O GITHUB_TOKEN padrão também funciona, mas com métricas limitadas.
          token: ${{ secrets.METRICS_TOKEN }}
          user: jeffer-matos
          template: classic
          filename: assets/metrics.svg
          committer_branch: main
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_lines: yes
          config_display: large
