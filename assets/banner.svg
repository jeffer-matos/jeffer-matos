<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jefferson Matos — Software Engineer, Tech Lead, Full Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="45%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#081229"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0090FF"/>
      <stop offset="55%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7CFCFF"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0090FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0090FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0090FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0090FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#0c2036" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes driftLine { to { stroke-dashoffset: -420; } }
      @keyframes shimmer { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .node { animation: pulseGlow 3.4s ease-in-out infinite; }
      .circuit { stroke-dasharray: 7 11; animation: driftLine 9s linear infinite; }
      .accent-line { animation: shimmer 3.2s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="400" fill="url(#bgGrad)"/>
  <rect width="1600" height="400" fill="url(#grid)" opacity="0.55"/>
  <rect width="1600" height="400" fill="url(#glowSpot)"/>

  <!-- circuit traces — left flank -->
  <g fill="none" stroke="#00AAFF" stroke-width="1.4" opacity="0.4">
    <path class="circuit" style="animation-delay:0s"   d="M0 48 H150 L178 76 H330"/>
    <path class="circuit" style="animation-delay:-2s"  d="M0 100 H90 L118 128 H260 L288 156 H360"/>
    <path class="circuit" style="animation-delay:-4s"  d="M0 320 H140 L168 292 H300"/>
    <path class="circuit" style="animation-delay:-1s"  d="M0 360 H100 L128 332 H240 L268 304 H320"/>
    <path class="circuit" style="animation-delay:-3s"  d="M0 210 H60"/>
  </g>
  <g fill="#00E5FF" filter="url(#nodeGlow)">
    <circle class="node" style="animation-delay:0s"    cx="150" cy="48"  r="3.2"/>
    <circle class="node" style="animation-delay:-.6s"  cx="330" cy="76"  r="3.2"/>
    <circle class="node" style="animation-delay:-1.2s" cx="118" cy="128" r="3.2"/>
    <circle class="node" style="animation-delay:-1.8s" cx="360" cy="156" r="3.2"/>
    <circle class="node" style="animation-delay:-2.4s" cx="168" cy="292" r="3.2"/>
    <circle class="node" style="animation-delay:-.3s"  cx="320" cy="304" r="3.2"/>
  </g>

  <!-- circuit traces — right flank (mirrored) -->
  <g fill="none" stroke="#00AAFF" stroke-width="1.4" opacity="0.4">
    <path class="circuit" style="animation-delay:-1.5s" d="M1600 48 H1450 L1422 76 H1270"/>
    <path class="circuit" style="animation-delay:-3.5s" d="M1600 100 H1510 L1482 128 H1340 L1312 156 H1240"/>
    <path class="circuit" style="animation-delay:-.5s"  d="M1600 320 H1460 L1432 292 H1300"/>
    <path class="circuit" style="animation-delay:-2.5s" d="M1600 360 H1500 L1472 332 H1360 L1332 304 H1280"/>
    <path class="circuit" style="animation-delay:-4.5s" d="M1600 210 H1540"/>
  </g>
  <g fill="#00E5FF" filter="url(#nodeGlow)">
    <circle class="node" style="animation-delay:-.4s"  cx="1450" cy="48"  r="3.2"/>
    <circle class="node" style="animation-delay:-1s"   cx="1270" cy="76"  r="3.2"/>
    <circle class="node" style="animation-delay:-1.6s" cx="1482" cy="128" r="3.2"/>
    <circle class="node" style="animation-delay:-2.2s" cx="1240" cy="156" r="3.2"/>
    <circle class="node" style="animation-delay:-2.8s" cx="1432" cy="292" r="3.2"/>
    <circle class="node" style="animation-delay:-.9s"  cx="1280" cy="304" r="3.2"/>
  </g>

  <!-- corner terminal brackets -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.55" fill="none">
    <path d="M40 40 H70 M40 40 V70"/>
    <path d="M1560 40 H1530 M1560 40 V70"/>
    <path d="M40 360 H70 M40 360 V330"/>
    <path d="M1560 360 H1530 M1560 360 V330"/>
  </g>

  <!-- core content -->
  <text x="800" y="168" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="700" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="2">
    JEFFERSON MATOS
  </text>

  <rect class="accent-line" x="620" y="196" width="360" height="2.5" fill="url(#lineGrad)"/>

  <text x="800" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#8FD8FF" letter-spacing="4">
    SOFTWARE ENGINEER · TECH LEAD · FULL STACK DEVELOPER
  </text>

  <text x="800" y="278" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Courier New',monospace" font-size="18" fill="#4FD1FF" opacity="0.9">
    Node.js • NestJS • React • TypeScript • IA • Cloud<tspan class="cursor" fill="#7CFCFF">▍</tspan>
  </text>

  <!-- company chip -->
  <g transform="translate(800,315)">
    <rect x="-108" y="-18" width="216" height="34" rx="17" fill="none" stroke="#00AAFF" stroke-opacity="0.55" stroke-width="1.3"/>
    <circle cx="-84" cy="0" r="4" fill="#00E5FF" filter="url(#nodeGlow)"/>
    <text x="-64" y="5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#B9E9FF" letter-spacing="1">
      Tech Lead @ Espaço Smart
    </text>
  </g>
</svg>
